<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="top-nav">
      <div class="day">Monday</div>
      <div class="day">Tuesday</div>
      <div class="day">Wednesday</div>
      <div class="day active">TODAY</div>
      <div class="day">Friday</div>
      <div class="day">Saturday</div>
      <div class="day">Sunday</div>

      <section class="date-time">
        <div class="date">dd.mm.yyyy</div>
        <div class="time">20:31</div>
      </section>

    </header>


    <main class="task-list">
      <div class="task-item">
        <div class="task-text">Example task</div>
        <div class="task-status"></div>
      </div>
    </main>

    <footer class="bottom-bar">
      <button id="open-settings" class="icon-btn settings">⚙️</button>
      <button id="open-add-task" class="icon-btn add">＋</button>
      <button id="open-summary" class="icon-btn summary">📊</button>
    </footer>
  </div>

  <script src="/js/neutralino.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
