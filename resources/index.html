<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <link rel="stylesheet" href="css/task.css" />
  <link rel="stylesheet" href="css/notesSidebar.css" />
  <link rel="stylesheet" href="css/weeklyReview.css" />
</head>
<body>
  <div id="app" class="wrapper">
    <header id="navbar">
      <div class="days" id="daysContainer">
      </div>

      <div class="line-wrapper">
        <div class="line-solid"></div>
        <div class="line-dashed"></div>
      </div>

      <div class="center-date" id="date"></div>
      <div class="center-time" id="time"></div>
    </header>

    <aside id="notesSidebar" class="notes-sidebar">
      <div class="notes-header">
        <h3 id="notesDay">Notes/Blockers</h3>
      </div>
      <textarea 
        id="notesTextarea" 
        class="notes-textarea"
        placeholder="Write your notes for this day..."
      ></textarea>
    </aside>

    <main class="task-list">
      <div id="taskContainer" class="task-container"></div>

      <dialog id="modal">
        <div class="modal-wrapper">
          <input 
            id="taskTitle" 
            type="text" 
            class="input"
            placeholder="Title of the task"
          >

          <textarea 
            id="taskDescription" 
            class="textarea"
            placeholder="description"
          ></textarea>

          <div class="controls-wrapper">
            <button id="addSubtaskBtn" class="add-task-button">
              <img src="/assets/icons/addTask.png"/>
            </button>

            <button id="deleteTaskBtn" class="delete-task-button">
              <img src="/assets/icons/trash_bin.png"/>
            </button>
          </div>

          <div class="subtasks-wrapper">
            
          </div>

          <div class="center">
            <button id="closeModal" class="create-task-button">Create</button>
          </div>
        </div>
      </dialog>

      <dialog id="optionsModal">
        <div class="modal-wrapper">
          <div class="options-fields">
            <input 
              id="optionsUsername" 
              type="text" 
              class="input"
              placeholder="Username"
            >

            <input 
              id="optionsPassword" 
              type="password" 
              class="input"
              placeholder="Password"
            >

            <input 
              id="optionsUrl" 
              type="url" 
              class="input"
              placeholder="URL"
            >

            <input 
              id="dayWeeklyReview" 
              type="date" 
              class="input"
              placeholder="Day for weekly review"
            >
          </div>

          <div class="center">
            <button id="saveOptions" class="create-task-button">Save</button>
          </div>
        </div>
      </dialog>

      <dialog id="weeklyReviewModal">
        <div class="weekly-review-wrapper">
          <div class="weekly-review-header">
            <div class="weekly-review-title-section">
              <p class="weekly-review-title">Weekly review</p>
              <div class="weekly-review-line"></div>
              <p class="weekly-review-range" id="weekRangeText">01 - 07</p>
            </div>
          </div>

          <div class="weekly-stats-container">
            <table class="weekly-stats-table">
              <thead>
                <tr>
                  <th class="weekly-stats-label-header"></th>
                  <th>Monday</th>
                  <th>Tuesday</th>
                  <th>Wednesday</th>
                  <th>Thursday</th>
                  <th>Friday</th>
                  <th>Saturday</th>
                  <th>Sunday</th>
                </tr>
              </thead>
              <tbody class="weekly-stats-body">
              </tbody>
            </table>
          </div>

          <div class="weekly-review-section">
            <div class="weekly-notes-container">
              <div class="weekly-notes-header">
                <button id="prevDayBtn" class="weekly-nav-btn">◀</button>
                <h4 id="weekDayName" class="weekly-day-name">Monday</h4>
                <button id="nextDayBtn" class="weekly-nav-btn">▶</button>
                <div class="weekly-line-wrapper">
                  <div class="weekly-line-solid"></div>
                  <div class="weekly-line-dashed"></div>
                </div>
              </div>
              <div id="weeklyNotes" class="weekly-notes-content">No notes for this day</div>
            </div>
          </div>

          <div class="weekly-review-section">
            <div id="lastWeekSummary" class="weekly-summary-display">No summary for last week</div>
          </div>

          <div class="weekly-review-section">
            <textarea 
              id="weekSummaryTextarea" 
              class="weekly-summary-textarea"
              placeholder="Write your summary for this week..."
            ></textarea>
          </div>
        </div>
      </dialog>
    </main>

    <footer class="bottom-bar">
      <button id="openModal" class="add-task-button">
        <img src="/assets/icons/addTask.png"/>
      </button>
      
      <button id="settingsButton" class="settings-button">
        <img src="/assets/icons/settings.png"/>
      </button>
    </footer>
  </div>

  <script src="/js/neutralino.js"></script>
  <script src="/libs/pouchdb-9.0.0.min.js"></script>
  <script src="/js/main.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module" src="/js/modal.js"></script>
  <script type="module" src="/js/options.js"></script>
  <script type="module" src="/js/task.js"></script>
  <script type="module" src="/js/notesSidebar.js"></script>
  <script type="module" src="/js/weeklyReview.js"></script>
</body>
</html>
