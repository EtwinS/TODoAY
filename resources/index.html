<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="wrapper">
    <header id="navbar">
      <div class="days">
        <span data-day="1" class="day">Monday</span>
        <span data-day="2" class="day">Tuesday</span>
        <span data-day="3" class="day">Wednesday</span>

        <span data-day="today" class="day active">TODAY</span>

        <span data-day="5" class="day">Friday</span>
        <span data-day="6" class="day">Saturday</span>
        <span data-day="7" class="day">Sunday</span>
      </div>

      <div class="line-wrapper">
        <div class="line-solid"></div>
        <div class="line-dashed"></div>
      </div>

      <div class="center-date" id="date"></div>
      <div class="center-time" id="time"></div>
    </header>

    <main class="task-list">
      <div class="task-item">
        <div class="task-text"></div>
        <div class="task-status"></div>
      </div>

      <button class="add-task-button">
        <img src="/assets/icons/addTask.png"/>
      </button>
    </main>
      

    <footer class="bottom-bar">
      <button class="settings-button">
        <img src="/assets/icons/settings.png"/>
      </button>
    </footer>
  </div>

  <script src="/js/neutralino.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/navbar.js"></script>
</body>
</html>
